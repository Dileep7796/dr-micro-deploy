name: Deploy to ECS Fargate

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types: [completed]
    branches:
      - main

env:
  AWS_REGION: ap-south-1
  ECS_CLUSTER: micro-cluster
  ECS_SERVICE: micro-service
  ECS_TASK_DEFINITION: micro-task
  CONTAINER_NAME: micro-deploy

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Existing Task Definition
        run: |
          aws ecs describe-task-definition \
          --task-definition ${{ env.ECS_TASK_DEFINITION }} \
          --query taskDefinition \
          > task-definition.json

      - name: Get Latest Docker Image
        id: image
        run: |
          REGISTRY=$(aws ecr describe-registry --query 'registryData.registryId' --output text).dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          echo "image=${REGISTRY}/${{ env.CONTAINER_NAME }}:latest" >> $GITHUB_OUTPUT

      - name: Update Task Definition
        id: task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.image }}

      - name: Deploy ECS Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
