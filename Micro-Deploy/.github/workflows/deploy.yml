name: Build and Deploy ECS Fargate

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-south-1

  ECR_REPOSITORY: micro-deploy

  ECS_CLUSTER: micro-cluster

  ECS_SERVICE: micro-service

  ECS_TASK_DEFINITION: micro-task

  CONTAINER_NAME: micro-deploy

permissions:
  id-token: write
  contents: read

jobs:

  build:

    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4


    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: |
        cd app
        npm ci

    - name: Run Unit Tests
      run: |
        cd app
        npm test --if-present


    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.5.7

    - name: Terraform Format
      run: |
        cd terraform
        terraform fmt -check -recursive

    - name: Terraform Init
      run: |
        cd terraform
        terraform init

    - name: Terraform Validate
      run: |
        cd terraform
        terraform validate

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE }}
        aws-region: ${{ env.AWS_REGION }}


    - name: Login to Amazon ECR
      id: ecr
      uses: aws-actions/amazon-ecr-login@v2


    - name: Build Docker Image
      run: |
        docker build \
        -t ${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
        ./app


    - name: Scan Docker Image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        format: table
        exit-code: 1
        ignore-unfixed: true
        severity: CRITICAL,HIGH


    - name: Tag Docker Image
      run: |

        docker tag \
        ${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
        ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

    - name: Push Docker Image
      run: |

        docker push \
        ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}


    - name: Save Image URI
      id: image
      run: |
        echo "image=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> $GITHUB_OUTPUT


  deploy:

    needs: build

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE }}
        aws-region: ${{ env.AWS_REGION }}


    - name: Download Existing Task Definition
      run: |

        aws ecs describe-task-definition \
        --task-definition ${{ env.ECS_TASK_DEFINITION }} \
        --query taskDefinition \
        > task-definition.json


    - name: Update Task Definition
      id: task

      uses: aws-actions/amazon-ecs-render-task-definition@v1

      with:
        task-definition: task-definition.json

        container-name: ${{ env.CONTAINER_NAME }}

        image: ${{ needs.build.outputs.image }}


    - name: Deploy ECS Service
      uses: aws-actions/amazon-ecs-deploy-task-definition@v2

      with:

        task-definition: ${{ steps.task.outputs.task-definition }}

        service: ${{ env.ECS_SERVICE }}

        cluster: ${{ env.ECS_CLUSTER }}

        wait-for-service-stability: true